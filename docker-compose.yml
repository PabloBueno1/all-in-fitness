
services:
  db:
    image: postgres:16
    container_name: fitness_db
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: fitness_api
    restart: always
    depends_on:
      - db
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  
  flutter_frontend:
    build: ./fitness_frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  pgdata:
